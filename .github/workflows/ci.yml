name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatbuffers-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test with race detection
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Verify cross-language table-key vectors
        run: python testdata/verify_table_key_vectors.py

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m
